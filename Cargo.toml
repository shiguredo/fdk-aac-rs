[package]
name = "shiguredo_fdk_aac"
version = "2026.1.0"
edition = "2024"
rust-version = "1.93"
description = "Rust bindings for FDK AAC encoder and decoder with runtime dynamic loading"
readme = "README.md"
homepage = "https://github.com/shiguredo/fdk-aac-rs"
repository = "https://github.com/shiguredo/fdk-aac-rs"
license = "Apache-2.0"
build = "build.rs"
include = ["/LICENSE", "/README.md", "/build.rs", "/src/**"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

# PBT (Property-Based Testing) 用のワークスペースメンバー
# fuzz は cargo-fuzz 用の独立クレートなのでワークスペースから除外する
[workspace]
members = ["pbt"]
exclude = ["fuzz"]

[dependencies]

[build-dependencies]
# FDK AAC の C ヘッダーから FFI バインディングを生成するために使用する
bindgen = "0.72"
